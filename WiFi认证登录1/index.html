<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WiFi认证上网</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
body {
  background: linear-gradient(135deg, #f0f7ff 0%, #d9e6ff 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  background: #fff;
  width: 100%;
  max-width: 420px;
  border-radius: 24px;
  padding: 32px 28px;
  box-shadow: 0 12px 36px rgba(0, 30, 80, 0.1);
}
.logo {
  text-align: center;
  font-size: 44px;
  color: #3b82f6;
  margin-bottom: 12px;
}
.title {
  text-align: center;
  font-size: 23px;
  font-weight: 600;
  color: #1e293b;
  margin-bottom: 6px;
}
.desc {
  text-align: center;
  color: #64748b;
  font-size: 14px;
  margin-bottom: 28px;
}
.wifi-info {
  background: #f8fafc;
  padding: 12px 16px;
  border-radius: 12px;
  text-align: center;
  margin-bottom: 24px;
  font-size: 14px;
  color: #334155;
}
.tab {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}
.tab-item {
  flex: 1;
  padding: 10px;
  text-align: center;
  border-radius: 12px;
  background: #f1f5f9;
  font-size: 13px;
  cursor: pointer;
  transition: 0.2s;
}
.tab-item.active {
  background: #3b82f6;
  color: #fff;
}
.page {
  display: none;
}
.page.active {
  display: block;
}
.form-item {
  margin-bottom: 16px;
}
.form-item label {
  display: block;
  font-size: 13px;
  color: #334155;
  margin-bottom: 6px;
}
.form-item input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  font-size: 15px;
  outline: none;
}
.form-item input:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}
.code-row {
  display: flex;
  gap: 10px;
}
.code-row input {
  flex: 1;
}
.code-btn {
  padding: 0 14px;
  border-radius: 12px;
  border: none;
  background: #eff6ff;
  color: #3b82f6;
  font-size: 13px;
  cursor: pointer;
}
.qrcode {
  text-align: center;
  padding: 20px;
}
.qrcode img {
  width: 160px;
  height: 160px;
  border-radius: 12px;
}
.agreement {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: #64748b;
  margin: 20px 0;
}
.btn-submit {
  width: 100%;
  padding: 15px;
  border-radius: 16px;
  border: none;
  background: linear-gradient(90deg, #3b82f6, #2563eb);
  color: white;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.security {
  font-size: 12px;
  color: #64748b;
  text-align: center;
  margin-top: 12px;
}
</style>
</head>
<body>

<div class="card">
  <div class="logo">📶</div>
  <div class="title">WiFi 认证上网</div>
  <div class="desc">请选择认证方式免费连接</div>

  <div class="wifi-info">
    当前WiFi：<strong>测试档5G edmi</strong>（固定）
  </div>

  <div class="tab">
    <div class="tab-item" data-target="page-phone">手机认证</div>
    <div class="tab-item active" data-target="page-email">邮箱认证</div>
    <div class="tab-item" data-target="page-wxa">小程序</div>
  </div>

  <div class="page" id="page-phone">
    <div class="form-item">
      <label>手机号码</label>
      <input type="text" id="phone" placeholder="请输入手机号" disabled>
    </div>
    <div class="form-item">
      <label>验证码</label>
      <div class="code-row">
        <input type="text" id="code" placeholder="暂未开放" disabled>
        <button class="code-btn" disabled>暂未开放</button>
      </div>
    </div>
  </div>

  <div class="page active" id="page-email">
    <div class="form-item">
      <label>邮箱地址</label>
      <input type="text" id="email" placeholder="请输入您的邮箱">
    </div>
    <div class="form-item">
      <label>验证码</label>
      <div class="code-row">
        <input type="text" id="emailCode" placeholder="请输入邮箱收到的验证码">
        <button class="code-btn" id="getEmailCode">获取验证码</button>
      </div>
    </div>
  </div>

  <div class="page" id="page-wxa">
    <div class="qrcode">
      <img src="https://picsum.photos/300/300" alt="小程序码">
      <div style="margin-top:10px;font-size:13px;color:#666">
        扫码小程序完成认证<br>（后续自行替换二维码）
      </div>
    </div>
  </div>

  <div class="agreement">
    <input type="checkbox" id="agree" checked>
    <span>同意上网协议与隐私政策</span>
  </div>

  <button class="btn-submit" id="login">确认连接上网</button>
  <div class="security">
    ✅ 安全检测中 · 防骚扰 · 防恶意访问
  </div>
</div>

<script>
// 选项卡切换
document.querySelectorAll('.tab-item').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab-item').forEach(i => i.classList.remove('active'))
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'))
    tab.classList.add('active')
    document.getElementById(tab.dataset.target).classList.add('active')
  }
})

// 发送邮箱验证码（调用后端真实接口）
document.getElementById('getEmailCode').onclick = async () => {
  const email = document.getElementById('email').value.trim()
  if (!email || !email.includes('@')) {
    alert('请输入正确的邮箱地址')
    return
  }
  const btn = document.getElementById('getEmailCode')
  btn.disabled = true
  btn.innerText = '发送中...'

  try {
    const res = await fetch('/api/send_email_code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    })
    const data = await res.json()
    if (data.ok) {
      alert('验证码已发送到您的邮箱，请查收')
      let sec = 60
      const timer = setInterval(() => {
        sec--
        btn.innerText = `${sec}秒后重发`
        if (sec <= 0) {
          clearInterval(timer)
          btn.innerText = '获取验证码'
          btn.disabled = false
        }
      }, 1000)
    } else {
      alert(data.msg)
      btn.innerText = '获取验证码'
      btn.disabled = false
    }
  } catch (e) {
    alert('网络错误，请稍后重试')
    btn.innerText = '获取验证码'
    btn.disabled = false
  }
}

// 登录认证（调用后端真实校验）
document.getElementById('login').onclick = async () => {
  const agree = document.getElementById('agree').checked
  if (!agree) {
    alert('请同意上网协议与隐私政策')
    return
  }

  const emailPage = document.getElementById('page-email').classList.contains('active')
  const wxaPage = document.getElementById('page-wxa').classList.contains('active')

  if (emailPage) {
    const email = document.getElementById('email').value.trim()
    const code = document.getElementById('emailCode').value.trim()
    if (!email || !code) {
      alert('请填写邮箱和验证码')
      return
    }

    try {
      const res = await fetch('/api/wifi_login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, code, agree })
      })
      const data = await res.json()
      if (data.ok) {
        location.href = '/success.html'
      } else {
        alert(data.msg)
      }
    } catch (e) {
      alert('网络错误，请稍后重试')
    }
  }

  if (wxaPage) {
    // 小程序扫码逻辑后续自己加
    alert('小程序认证暂未开放')
  }
}
</script>
</body>
</html>
