<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>连接成功</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
body {
  background: linear-gradient(135deg, #e6f7ff 0%, #d1e9ff 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  background: #fff;
  max-width: 400px;
  width: 100%;
  border-radius: 24px;
  padding: 40px 32px;
  text-align: center;
  box-shadow: 0 12px 36px rgba(0, 30, 80, 0.1);
}
.icon {
  font-size: 60px;
  margin-bottom: 20px;
}
.title {
  font-size: 24px;
  font-weight: 600;
  color: #1e293b;
  margin-bottom: 12px;
}
.desc {
  font-size: 15px;
  color: #64748b;
  line-height: 1.6;
  margin-bottom: 30px;
}
.btn {
  display: inline-block;
  padding: 14px 32px;
  border-radius: 16px;
  background: linear-gradient(90deg, #3b82f6, #2563eb);
  color: #fff;
  font-size: 16px;
  font-weight: 500;
  text-decoration: none;
}
</style>
</head>
<body>

<div class="card">
  <div class="icon">✅</div>
  <div class="title">WiFi 连接成功</div>
  <div class="desc">
    祝您旅行愉快<br>
    您可以体验高速无线网络
  </div>
  <br>
  <div style="font-size:14px; color:#999;">正在准备浏览器…</div>
</div>

<script>
// 成功后 1.5 秒跳转到必应
setTimeout(() => {
  window.location.href = 'https://www.bing.com';
}, 1500);
</script>

</body>
</html>
