<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WiFi认证上网</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
  background: linear-gradient(135deg, #f0f4ff 0%, #d9e2ff 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  background: #fff;
  width: 100%;
  max-width: 380px;
  border-radius: 24px;
  padding: 32px 28px;
  box-shadow: 0 12px 32px rgba(0, 30, 80, 0.1);
}

.logo {
  text-align: center;
  margin-bottom: 12px;
  font-size: 42px;
  color: #4361ee;
}

.title {
  text-align: center;
  font-size: 22px;
  font-weight: 600;
  color: #1e293b;
  margin-bottom: 8px;
}

.desc {
  text-align: center;
  color: #64748b;
  font-size: 14px;
  margin-bottom: 28px;
}

.form-item {
  margin-bottom: 16px;
}

.form-item label {
  display: block;
  font-size: 13px;
  color: #334155;
  margin-bottom: 6px;
}

.form-item input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  font-size: 15px;
  outline: none;
  transition: 0.2s;
}

.form-item input:focus {
  border-color: #4361ee;
  box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
}

.code-row {
  display: flex;
  gap: 10px;
}

.code-row input {
  flex: 1;
}

.code-btn {
  white-space: nowrap;
  padding: 0 16px;
  border-radius: 14px;
  border: none;
  background: #eef2ff;
  color: #4361ee;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}

.security {
  font-size: 12px;
  color: #64748b;
  margin-bottom: 16px;
  padding-left: 4px;
}

.agreement {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: #64748b;
  margin: 20px 0;
}

.agreement a {
  color: #4361ee;
  text-decoration: none;
}

.btn-submit {
  width: 100%;
  padding: 15px;
  border-radius: 16px;
  border: none;
  background: linear-gradient(90deg, #4361ee, #5856d6);
  color: white;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}

.btn-submit:active {
  transform: scale(0.98);
}

.tip {
  text-align: center;
  font-size: 12px;
  color: #94a3b8;
  margin-top: 16px;
}
</style>
</head>

<body>

<div class="card">
  <div class="logo">📶</div>
  <div class="title">WiFi 认证上网</div>
  <div class="desc">连接后即可免费使用无线网络</div>

  <div class="form-item">
    <label>WiFi 名称（固定）</label>
    <input type="text" value="测试档5G edmi" readonly style="background:#f7f8fa">
  </div>

  <div class="form-item">
    <label>手机号码</label>
    <input type="text" placeholder="请输入手机号" id="phone">
  </div>

  <div class="form-item">
    <label>验证码（随机4位数字）</label>
    <div class="code-row">
      <input type="text" placeholder="请输入验证码" id="code">
      <button class="code-btn" id="sendCode">查看验证码</button>
    </div>
  </div>

  <!-- 安全检测 -->
  <div class="security">
    ✔ 安全检测中：防恶意连接、异常访问拦截
  </div>

  <div class="agreement">
    <input type="checkbox" id="agree" checked>
    <span>我已阅读并同意 <a href="#">上网协议</a> 和 <a href="#">隐私政策</a></span>
  </div>

  <button class="btn-submit" id="login">确认连接上网</button>
  <div class="tip">认证成功后将自动接入网络</div>
</div>

<script>
let realCode = '';

// 生成随机4位验证码（前端模拟）
document.getElementById('sendCode').onclick = function() {
  const phone = document.getElementById('phone').value.trim();
  if (!phone) {
    alert('请输入手机号码');
    return;
  }

  // 生成4位随机验证码
  realCode = Math.floor(1000 + Math.random() * 9000).toString();
  this.innerText = '验证码：' + realCode;
  this.disabled = true;
  setTimeout(() => {
    this.innerText = '重新获取';
    this.disabled = false;
  }, 60000);
}

// 登录认证逻辑（框架已搭好，后面直接替换接口）
document.getElementById('login').onclick = function() {
  const phone = document.getElementById('phone').value.trim();
  const inputCode = document.getElementById('code').value.trim();
  const agree = document.getElementById('agree').checked;

  // ———— 安全检测逻辑 ————
  if (!phone || phone.length < 11) {
    alert('安全检测不通过：请输入正确的手机号');
    return;
  }
  if (!inputCode) {
    alert('安全检测不通过：请输入验证码');
    return;
  }
  if (inputCode !== realCode) {
    alert('安全检测不通过：验证码错误');
    return;
  }
  if (!agree) {
    alert('安全检测不通过：请同意上网协议');
    return;
  }

  // ———— 认证通过（这里后面对接WiFi网关接口） ————
  alert('✅ 认证成功！\nWiFi名称：测试档5G edmi\n已允许上网');

  // 这里可以写跳转、关闭窗口、调用网关放行
  // window.location.href = '成功页面.html';
};
</script>

</body>
</html>
